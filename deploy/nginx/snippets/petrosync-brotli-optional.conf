# Include only when the NGINX Brotli module is installed.
# On Debian/Ubuntu this is typically nginx-plus-module-brotli for NGINX Plus or
# a separately packaged dynamic module for the distro build.

brotli on;
brotli_comp_level 5;
brotli_min_length 1024;
brotli_types
  application/javascript
  application/json
  application/manifest+json
  application/wasm
  application/xml
  image/svg+xml
  text/css
  text/javascript
  text/plain
  text/xml;
