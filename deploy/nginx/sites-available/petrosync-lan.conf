server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name petrosync.local _;

  root /opt/petrosync/client/build;
  index index.html;

  access_log /var/log/nginx/petrosync-access.log petrosync_json;
  error_log /var/log/nginx/petrosync-error.log warn;

  client_max_body_size 25m;
  keepalive_timeout 65s;
  send_timeout 60s;
  limit_conn petrosync_addr 50;

  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/rss+xml
    application/vnd.ms-fontobject
    application/wasm
    application/x-font-ttf
    application/xml
    font/opentype
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

  include /etc/nginx/snippets/petrosync-security-headers.conf;

  location = /healthz {
    access_log off;
    include /etc/nginx/snippets/petrosync-security-headers.conf;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/petrosync-proxy.conf;
    proxy_pass http://petrosync_backend;
  }

  location ^~ /api/auth/ {
    limit_req zone=petrosync_auth burst=10 nodelay;
    include /etc/nginx/snippets/petrosync-security-headers.conf;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/petrosync-proxy.conf;
    proxy_pass http://petrosync_backend;
  }

  location ^~ /api/ {
    limit_req zone=petrosync_api burst=60 nodelay;
    include /etc/nginx/snippets/petrosync-security-headers.conf;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/petrosync-proxy.conf;
    proxy_pass http://petrosync_backend;
  }

  location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot|map)$ {
    access_log off;
    expires 30d;
    include /etc/nginx/snippets/petrosync-security-headers.conf;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    try_files $uri =404;
  }

  location = /index.html {
    include /etc/nginx/snippets/petrosync-security-headers.conf;
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/petrosync-security-headers.conf;
    add_header Cache-Control "no-store" always;
    try_files $uri $uri/ /index.html;
  }
}
