server {
  listen 80;
  listen [::]:80;
  server_name pump.example.com;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name pump.example.com;

  root /opt/petrosync/client/build;
  index index.html;

  access_log /var/log/nginx/petrosync-access.log petrosync_json;
  error_log /var/log/nginx/petrosync-error.log warn;

  ssl_certificate /etc/letsencrypt/live/pump.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/pump.example.com/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:petrosync_ssl:10m;
  ssl_session_tickets off;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_stapling on;
  ssl_stapling_verify on;
  resolver 1.1.1.1 8.8.8.8 valid=300s;
  resolver_timeout 5s;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  client_max_body_size 25m;
  keepalive_timeout 65s;
  send_timeout 60s;
  limit_conn petrosync_addr 50;

  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/rss+xml
    application/vnd.ms-fontobject
    application/wasm
    application/x-font-ttf
    application/xml
    font/opentype
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

  include /etc/nginx/snippets/petrosync-security-headers.conf;

  location = /healthz {
    access_log off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    include /etc/nginx/snippets/petrosync-security-headers.conf;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/petrosync-proxy.conf;
    proxy_pass http://petrosync_backend;
  }

  location ^~ /api/auth/ {
    limit_req zone=petrosync_auth burst=10 nodelay;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    include /etc/nginx/snippets/petrosync-security-headers.conf;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/petrosync-proxy.conf;
    proxy_pass http://petrosync_backend;
  }

  location ^~ /api/ {
    limit_req zone=petrosync_api burst=60 nodelay;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    include /etc/nginx/snippets/petrosync-security-headers.conf;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/petrosync-proxy.conf;
    proxy_pass http://petrosync_backend;
  }

  location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot|map)$ {
    access_log off;
    expires 30d;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    include /etc/nginx/snippets/petrosync-security-headers.conf;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    include /etc/nginx/snippets/petrosync-security-headers.conf;
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  location / {
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    include /etc/nginx/snippets/petrosync-security-headers.conf;
    add_header Cache-Control "no-store" always;
    try_files $uri $uri/ /index.html;
  }
}
