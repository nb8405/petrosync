# Include this file from the nginx http {} context before the PetroSync site.

server_tokens off;

log_format petrosync_json escape=json
  '{'
  '"time":"$time_iso8601",'
  '"remote_addr":"$remote_addr",'
  '"request_id":"$request_id",'
  '"host":"$host",'
  '"method":"$request_method",'
  '"uri":"$request_uri",'
  '"status":$status,'
  '"bytes_sent":$bytes_sent,'
  '"request_time":$request_time,'
  '"upstream_addr":"$upstream_addr",'
  '"upstream_status":"$upstream_status",'
  '"upstream_response_time":"$upstream_response_time",'
  '"referer":"$http_referer",'
  '"user_agent":"$http_user_agent"'
  '}';

map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}

limit_req_zone $binary_remote_addr zone=petrosync_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=petrosync_auth:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=petrosync_addr:10m;

upstream petrosync_backend {
  zone petrosync_backend 64k;
  server 127.0.0.1:5000 max_fails=3 fail_timeout=10s;
  keepalive 32;
}
